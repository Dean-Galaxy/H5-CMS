  "components": {
    "securitySchemes": {
      "session": {
        "type": "apiKey",
        "in": "cookie",
        "name": "{H5_WORKSPACE}_viewer",
        "description": "部署时以 H5_WORKSPACE 替换前缀，由服务端 Set-Cookie；HttpOnly 会话，不是客户端自行填写的 API key。"
      },
      "staffSession": {
        "type": "apiKey",
        "in": "cookie",
        "name": "{H5_WORKSPACE}_admin",
        "description": "独立后台会话，必须经 Filament 密码和动态码/恢复码验证；后台不启用记住登录。"
      }
    },
    "schemas": {
      "Role": {
        "type": "string",
        "enum": [
          "owner",
          "content_operator",
          "support",
          "acquisition"
        ]
      },
      "SubscriptionState": {
        "type": "string",
        "enum": [
          "none",
          "pending",
          "active",
          "canceling",
          "past_due",
          "ended",
          "unknown"
        ]
      },
      "OrderState": {
        "type": "string",
        "enum": [
          "pending",
          "processing",
          "paid",
          "failed",
          "expired",
          "canceled",
          "review_required"
        ]
      },
      "PaymentState": {
        "type": "string",
        "enum": [
          "pending",
          "succeeded",
          "failed",
          "refunded",
          "partially_refunded",
          "unknown"
        ]
      },
      "TransactionKind": {
        "type": "string",
        "enum": [
          "first_subscription",
          "resubscription",
          "renewal"
        ]
      },
      "SubscriptionAction": {
        "type": "string",
        "enum": [
          "checkout",
          "cancel",
          "resume",
          "resolve_payment"
        ]
      },
      "ErrorCode": {
        "type": "string",
        "enum": [
          "VALIDATION_FAILED",
          "INVALID_CREDENTIALS",
          "AUTHENTICATION_REQUIRED",
          "EMAIL_UNVERIFIED",
          "TOKEN_INVALID",
          "TOKEN_EXPIRED",
          "TOKEN_REPLAYED",
          "CSRF_MISMATCH",
          "RATE_LIMITED",
          "ACCOUNT_DISABLED",
          "SESSION_REVOKED",
          "MFA_REQUIRED",
          "NOT_AUTHORIZED",
          "NOT_FOUND",
          "MEMBERSHIP_REQUIRED",
          "UNPUBLISHED",
          "REGION_BLOCKED",
          "MEDIA_NOT_READY",
          "BILLING_PENDING",
          "SUBSCRIPTION_EXISTS",
          "STALE_VERSION",
          "DEPENDENCY_NOT_READY",
          "INTERNAL_ERROR"
        ]
      },
      "Error": {
        "type": "object",
        "properties": {
          "error": {
            "type": "object",
