<style>
#h5-review{--h5-bg:light-dark(#f6f7f9,#15171c);--h5-paper:light-dark(#fff,#1c2027);--h5-text:light-dark(#202733,#ecedf1);--h5-muted:light-dark(#647082,#aab2c1);--h5-line:light-dark(#e6e9ee,#333a46);--h5-ink:light-dark(#263547,#e6eaf1);--h5-inktext:light-dark(#fff,#18202c);--h5-soft:light-dark(#eef2f7,#2c3442);--h5-orange:light-dark(#985200,#f2bb72);--h5-orangebg:light-dark(#fff4e4,#3b3024);--h5-green:light-dark(#17734c,#8ad8b3);--h5-greenbg:light-dark(#eaf7f0,#223b31);--h5-red:light-dark(#b13434,#f5a2a2);--h5-redbg:light-dark(#fff0ef,#422a2d);--h5-pad:15px;font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--h5-text);width:100%;border:1px solid var(--h5-line);border-radius:14px;background:var(--h5-bg);box-sizing:border-box;position:relative;isolation:isolate;}

#h5-review h2{font-size:18px;font-weight:600}
#h5-review h3{font-size:15px;font-weight:600}
#h5-review small,.h5-small{font-size:12px}
#h5-review .h5-muted{color:var(--h5-muted)}
#h5-review .h5-top{min-height:64px;padding:14px 112px 14px 22px;background:var(--h5-paper);border-bottom:1px solid var(--h5-line);border-radius:14px 14px 0 0;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
#h5-review .h5-brand{display:flex;align-items:center;gap:10px;font-weight:600;white-space:nowrap}
#h5-review .h5-mark{display:grid;place-items:center;background:var(--h5-ink);color:var(--h5-inktext);width:31px;height:31px;border-radius:9px;font-size:12px;letter-spacing:1px}
#h5-review .h5-demo{font-size:12px;color:var(--h5-orange);background:var(--h5-orangebg);padding:4px 9px;border-radius:5px}
#h5-review .h5-layout{display:grid;grid-template-columns:164px minmax(0,1fr);min-height:626px}
#h5-review .h5-side{padding:22px 12px;background:var(--h5-paper);border-right:1px solid var(--h5-line);border-bottom-left-radius:14px;display:flex;flex-direction:column;gap:7px}
#h5-review .h5-nav{border:0;background:transparent;display:flex;gap:10px;align-items:center;text-align:left;padding:12px;border-radius:7px;width:100%;font-weight:500}
#h5-review .h5-nav[aria-current=page]{background:var(--h5-soft);color:var(--h5-text)}
#h5-review .h5-side-foot{margin-top:auto;padding:36px 12px 6px;color:var(--h5-muted);font-size:12px}
#h5-review .h5-avatar{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--h5-soft);color:var(--h5-text);margin-right:6px}
#h5-review .h5-work{min-width:0;padding:25px 26px 20px}
#h5-review .h5-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
#h5-review .h5-heading p{margin-top:5px;color:var(--h5-muted);font-size:13px}
#h5-review .h5-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#h5-review .h5-spread{justify-content:space-between}
#h5-review .h5-button{border:1px solid var(--h5-line);border-radius:7px;padding:8px 13px;background:var(--h5-paper);display:inline-flex;gap:7px;align-items:center;justify-content:center;white-space:normal;min-height:37px}
#h5-review .h5-primary{background:var(--h5-ink);color:var(--h5-inktext);border-color:var(--h5-ink)}
#h5-review .h5-danger{color:var(--h5-red)}

#h5-review .h5-tabs{display:flex;gap:23px;border-bottom:1px solid var(--h5-line);margin-bottom:22px;flex-wrap:wrap}
#h5-review .h5-tab{padding:0 0 12px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--h5-muted);white-space:nowrap}
#h5-review .h5-tab[aria-selected=true]{color:var(--h5-text);border-bottom-color:var(--h5-ink);font-weight:600}
#h5-review .h5-tools{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
#h5-review .h5-input,#h5-review .h5-select,#h5-review .h5-textarea{border:1px solid var(--h5-line);border-radius:7px;padding:9px 11px;background:var(--h5-paper);color:var(--h5-text);min-width:0;max-width:100%;width:100%}
#h5-review .h5-search{width:245px}
#h5-review .h5-select-inline{width:auto}
#h5-review .h5-panel{background:var(--h5-paper);border:1px solid var(--h5-line);border-radius:10px;padding:20px}
#h5-review .h5-table-wrap{background:var(--h5-paper);border:1px solid var(--h5-line);border-radius:10px;overflow-x:auto}
#h5-review table{border-collapse:collapse;width:100%;text-align:left}
#h5-review th{font-size:12px;font-weight:500;color:var(--h5-muted);background:var(--h5-bg);white-space:nowrap}
#h5-review th,#h5-review td{padding:var(--h5-pad) 12px;border-bottom:1px solid var(--h5-line);vertical-align:middle}
#h5-review tr:last-child td{border-bottom:0}
#h5-review .h5-name{font-weight:600}
#h5-review .h5-film{display:flex;align-items:center;gap:12px;min-width:170px}
#h5-review .h5-poster{width:39px;height:54px;flex:none;border-radius:5px;background:var(--h5-soft);color:var(--h5-muted);display:grid;place-items:center;font-size:11px;letter-spacing:2px;writing-mode:vertical-rl}
#h5-review .h5-pill{display:inline-block;border-radius:5px;background:var(--h5-soft);padding:3px 7px;white-space:nowrap;font-size:12px}
#h5-review .h5-ok{color:var(--h5-green);background:var(--h5-greenbg)}
#h5-review .h5-warn{color:var(--h5-orange);background:var(--h5-orangebg)}
#h5-review .h5-bad{color:var(--h5-red);background:var(--h5-redbg)}
#h5-review .h5-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--h5-muted);font-size:12px;margin-top:18px}
#h5-review .h5-alert{background:var(--h5-orangebg);color:var(--h5-orange);padding:12px 14px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:17px}
#h5-review .h5-alert-good{background:var(--h5-greenbg);color:var(--h5-green)}
#h5-review .h5-subhead{margin-bottom:18px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
#h5-review .h5-crumb{margin-bottom:14px;font-size:12px;color:var(--h5-muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#h5-review .h5-chip{padding:6px 10px;border:1px solid var(--h5-line);border-radius:6px;background:var(--h5-paper);font-size:12px}
#h5-review .h5-chip[aria-pressed=true]{background:var(--h5-soft);border-color:var(--h5-muted)}
#h5-review .h5-formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
#h5-review label.h5-field{display:grid;gap:6px}
#h5-review .h5-field small{color:var(--h5-muted)}
#h5-review .h5-span{grid-column:1/-1}
#h5-review .h5-formactions{border-top:1px solid var(--h5-line);margin-top:22px;padding-top:17px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
#h5-review .h5-split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(230px,.8fr);gap:17px;align-items:start}
#h5-review .h5-choice{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--h5-line);border-radius:8px;margin-top:10px;background:var(--h5-paper)}
#h5-review .h5-choice input{margin-top:4px;accent-color:var(--h5-ink)}
#h5-review .h5-choice:has(input:checked){border-color:var(--h5-muted);background:var(--h5-soft)}
#h5-review .h5-note{color:var(--h5-muted);font-size:12px;margin-top:9px}
#h5-review .h5-checkline{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid var(--h5-line)}
#h5-review .h5-checkline:last-child{border-bottom:0}
#h5-review .h5-checkline .h5-grow{flex:1}
#h5-review .h5-green{color:var(--h5-green)}
#h5-review .h5-red{color:var(--h5-red)}
#h5-review .h5-schedule-row{padding:10px 0;border-bottom:1px solid var(--h5-line);display:flex;gap:12px;justify-content:space-between;font-size:12px}
#h5-review .h5-schedule-row:last-child{border:0}
#h5-review .h5-money{position:relative}
#h5-review .h5-money span{position:absolute;left:12px;top:10px;color:var(--h5-muted)}
#h5-review .h5-money input{padding-left:28px}
#h5-review .h5-overlay:empty{display:none}
#h5-review .h5-overlay{position:absolute;inset:0;background:light-dark(#26354766,#0009);z-index:5;border-radius:14px;padding:62px 20px 20px;display:flex;align-items:flex-start;justify-content:center}
#h5-review .h5-dialog{background:var(--h5-paper);border:1px solid var(--h5-line);border-radius:12px;padding:24px;width:640px;max-width:100%;box-shadow:0 16px 64px light-dark(#0002,#0005)}
#h5-review .h5-media-row{padding:17px 0;border-bottom:1px solid var(--h5-line)}
#h5-review .h5-media-row h3{display:flex;gap:7px;align-items:center}
#h5-review .h5-media-row:last-of-type{border-bottom:0}
#h5-review .h5-current-file{margin-top:8px;font-size:13px;overflow-wrap:anywhere}
#h5-review .h5-candidate{margin-top:10px;background:var(--h5-soft);border-radius:7px;padding:12px;font-size:13px;overflow-wrap:anywhere}
#h5-review .h5-plan-timing{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:13px 0}
#h5-review .h5-plan-timing label{display:flex;gap:6px;align-items:center}
#h5-review .h5-schedule-row span:last-child{text-align:right}
#h5-review .h5-dialog h2{margin-bottom:5px}
#h5-review .h5-dialog .h5-close{float:right}
#h5-review .h5-drop{padding:24px 16px;border:1px dashed var(--h5-muted);border-radius:8px;text-align:center;margin:18px 0;display:grid;justify-items:center;gap:9px}
#h5-review .h5-modalfooter{display:flex;justify-content:flex-end;gap:9px;margin-top:20px;flex-wrap:wrap}
#h5-review .h5-status{min-height:24px;margin-top:14px;font-size:12px;color:var(--h5-green)}
#h5-review .h5-gridassets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
#h5-review .h5-asset{border:1px solid var(--h5-line);background:var(--h5-paper);border-radius:9px;padding:14px;min-width:0}
#h5-review .h5-asset-preview{background:var(--h5-soft);border-radius:5px;height:96px;display:grid;place-items:center;margin-bottom:10px;color:var(--h5-muted)}
#h5-review .h5-asset p{overflow-wrap:anywhere}
#h5-review .h5-mini-flow{display:flex;gap:12px;align-items:center;color:var(--h5-muted);font-size:12px;flex-wrap:wrap;margin-bottom:18px}
#h5-review .h5-mini-flow strong{color:var(--h5-text);font-weight:600}
#h5-review .h5-empty{text-align:center;padding:38px 20px;color:var(--h5-muted)}
#h5-review .h5-preview-screen{height:180px;background:var(--h5-soft);display:grid;place-items:center;border-radius:8px;margin-top:18px;color:var(--h5-muted)}
#h5-review .h5-dl{display:grid;grid-template-columns:auto 1fr;gap:12px 18px;margin:18px 0}
#h5-review .h5-dl dt{color:var(--h5-muted)}
#h5-review .h5-dl dd{margin:0}
#h5-review .h5-error{color:var(--h5-red);font-size:12px;min-height:20px}
#h5-review [hidden]{display:none!important}
#h5-review svg{width:17px;height:17px;flex:none}
@media(max-width:580px){#h5-review .h5-table-wrap table{min-width:580px}}
@media(max-width:800px){#h5-review .h5-layout{grid-template-columns:1fr}#h5-review .h5-side{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--h5-line);border-radius:0;padding:10px 16px}#h5-review .h5-nav{width:auto;padding:7px 10px;font-size:12px}#h5-review .h5-side-foot{display:none}#h5-review .h5-work{padding:22px 18px}#h5-review .h5-split{grid-template-columns:1fr 1fr}#h5-review .h5-top{padding-left:18px}}
@media(max-width:580px){#h5-review .h5-work{padding:18px 12px}#h5-review .h5-top{padding-right:98px;gap:6px}#h5-review .h5-demo{font-size:11px}#h5-review .h5-tabs{gap:16px 18px}#h5-review .h5-formgrid,#h5-review .h5-split{grid-template-columns:1fr}#h5-review .h5-gridassets{grid-template-columns:1fr 1fr}#h5-review .h5-panel{padding:15px}#h5-review .h5-search{width:100%}#h5-review h1{font-size:21px}#h5-review .h5-overlay{padding:18px 10px}#h5-review .h5-dialog{padding:17px}#h5-review .h5-button{min-height:42px}#h5-review .h5-nav{min-height:42px}#h5-review .h5-table-wrap{max-width:100%}#h5-review .h5-optional{display:none}}
</style>
<div id="h5-review" aria-label="H5 员工后台新版交互预览">
  <header class="h5-top"><div class="h5-brand"><span class="h5-mark">H5</span>员工工作台</div><span class="h5-demo">交互样稿 v2 · 全部为示例数据</span></header>
  <div class="h5-layout">
    <nav class="h5-side" aria-label="后台模块">
      <button class="h5-nav cursor-interaction" data-module="content" aria-current="page"><i data-lucide="clapperboard" aria-hidden="true"></i>内容管理</button>
      <button class="h5-nav cursor-interaction" data-module="billing"><i data-lucide="credit-card" aria-hidden="true"></i>订单与会员</button>
      <button class="h5-nav cursor-interaction" data-module="acquisition"><i data-lucide="megaphone" aria-hidden="true"></i>投流管理</button>
      <button class="h5-nav cursor-interaction" data-module="staff"><i data-lucide="users" aria-hidden="true"></i>员工与权限</button>
      <button class="h5-nav cursor-interaction" data-module="settings"><i data-lucide="settings-2" aria-hidden="true"></i>全局设置</button>
      <div class="h5-side-foot"><div><span class="h5-avatar">管</span>负责人视角</div><p style="margin-top:12px">北京时间 UTC+8<br>金额统一 USD</p></div>
    </nav>
    <main class="h5-work"><div id="h5-screen"></div><div id="h5-status" class="h5-status" aria-live="polite"></div></main>
  </div>
  <div id="h5-overlay" class="h5-overlay"></div>
</div>
<script>
(()=>{
const root=document.getElementById('h5-review'),screen=root.querySelector('#h5-screen'),overlay=root.querySelector('#h5-overlay'),status=root.querySelector('#h5-status');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const btn=(label,action,cls='',attr='')=>`<button type="button" class="h5-button cursor-interaction ${cls}" data-action="${action}" ${attr}>${label}</button>`;
const link=(label,action,attr='')=>`<button type="button" class="h5-link cursor-interaction" data-action="${action}" ${attr}>${label}</button>`;
const pill=(text,kind='')=>`<span class="h5-pill ${kind}">${text}</span>`;
const state={module:'content',section:'library',detail:false,tab:'episodes',title:'逆光之约',en:'Into the Light',total:35,issues:[8,12],published:0,plan:'draft',mode:'completed',timing:'scheduled',date:'2026-10-22T00:00',frequency:1,batch:10,free:5,freeOverride:false,filter:'all',page:0,search:'',listFilter:'all',billTab:'prices',staffTab:'people',acqTab:'links',dirty:false,history:[],price:'12.00',promo:'3.00',withdrawn:false,episodeMeta:{},cover:'cover.jpg',banner:'banner.jpg'};
let dialogType='',chosenFiles=false,returnFocus=null,pendingNav=null,busy=false,editSession=null,imageSession=null;
const demoNow=new Date('2026-10-21T12:00:00+08:00');
const saved=window.openai?.widgetState?.privateContent;
if(saved?.version===2){if(['content','billing','staff','settings','acquisition'].includes(saved.module))state.module=saved.module;if(['library','schedule','categories','banners'].includes(saved.section))state.section=saved.section;state.detail=!!saved.detail;if(['info','episodes','rights','release','history'].includes(saved.tab))state.tab=saved.tab;}
function persist(){window.openai?.setWidgetState?.({modelContent:{prototype:'08 员工后台体验与交互改版 v2',currentModule:state.module,currentTab:state.detail?state.tab:state.section,reviewOnly:true},privateContent:{version:2,module:state.module,section:state.section,detail:state.detail,tab:state.tab}})?.catch(()=>{});}
window.addEventListener('openai:set_globals',e=>{const p=e.detail?.globals?.widgetState?.privateContent;if(p?.version===2&&!overlay.children.length&&!state.dirty){if(['content','billing','staff','settings','acquisition'].includes(p.module))state.module=p.module;if(['library','schedule','categories','banners'].includes(p.section))state.section=p.section;if(['info','episodes','rights','release','history'].includes(p.tab))state.tab=p.tab;state.detail=!!p.detail;render();}});
function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});}
function tell(msg){status.textContent=msg;}
function heading(title,sub,actions=''){return `<div class="h5-heading"><div><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div><div class="h5-row">${actions}</div></div>`;}
function tabs(items,active,kind){return `<div class="h5-tabs" role="tablist" aria-label="${kind==='detail'?'单剧功能':'功能分栏'}">${items.map(([id,label])=>`<button type="button" role="tab" id="h5-tab-${kind}-${id}" aria-controls="h5-panel" aria-selected="${active===id}" class="h5-tab cursor-interaction" data-tab="${id}" data-kind="${kind}">${label}</button>`).join('')}</div>`;}
function panel(content,kind,active){return `<section id="h5-panel" role="tabpanel" aria-labelledby="h5-tab-${kind}-${active}">${content}</section>`;}
function navigate(fn){if(state.dirty){pendingNav=fn;showDialog('未保存的修改',`<p class="h5-muted">这页有尚未保存的内容。请选择如何继续。</p><div class="h5-modalfooter">${btn('继续编辑','close')}${btn('放弃修改并离开','discard','h5-danger')}${btn('保存并离开','save-leave','h5-primary')}</div>`,'dirty');return;}fn();render();persist();}
function openDrama(tab='episodes'){state.module='content';state.section='library';state.detail=true;state.tab=tab;state.filter='all';state.page=0;}
function render(){
root.querySelectorAll('[data-module]').forEach(b=>{if(b.dataset.module===state.module)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
status.textContent='';
if(state.module==='content')renderContent();else if(state.module==='billing')renderBilling();else if(state.module==='staff')renderStaff();else if(state.module==='settings')renderSettings();else renderAcquisition();
icons();
}
const contentTabs=[['library','剧目库'],['schedule','发布排期'],['categories','分类管理'],['banners','首页 Banner']];
function renderContent(){
if(state.detail){renderDetail();return;}
screen.innerHTML=heading('内容管理','剧目内管理视频、字幕与封面；首页横图在 Banner 中管理。',state.section==='library'?btn(icon('plus')+'新建剧目','new','h5-primary'):'')+tabs(contentTabs,state.section,'content')+panel(({library:library,schedule:schedule,categories:categories,banners:banners}[state.section])(),'content',state.section);
}
function library(){
const rows=[{title:state.title,en:state.en,status:state.withdrawn?'已下架':state.published?'已上架':state.plan==='active'?'待上线':'草稿',ready:`${35-state.issues.length} / 35`,published:`${state.published} / 35`,primary:true},{title:'迟到的告白',en:'A Late Confession',status:'已上架',ready:'24 / 24',published:'10 / 24'},{title:'城市回声',en:'Echoes of the City',status:'已下架',ready:'16 / 16',published:'16 / 16'}].filter(x=>(state.listFilter==='all'||x.status===state.listFilter)&&(`${x.title} ${x.en}`.toLowerCase().includes(state.search.toLowerCase())));
return `<div class="h5-tools"><input class="h5-input h5-search" id="h5-search" aria-label="搜索剧目" placeholder="搜索剧名" value="${esc(state.search)}"><select id="h5-list-filter" class="h5-select h5-select-inline" aria-label="剧目状态">${[['all','全部状态'],['草稿','草稿'],['待上线','待上线'],['已上架','已上架'],['已下架','已下架']].map(([v,l])=>`<option value="${v}" ${v===state.listFilter?'selected':''}>${l}</option>`).join('')}</select></div>

function episodes(){

function rights(){return `<form id="h5-rights" class="h5-panel"><div class="h5-formgrid"><label class="h5-field">授权地区<select class="h5-select"><option>美国（US）</option></select><small>按登记的地区限制播放</small></label><label class="h5-field">素材语言<select class="h5-select"><option>英语原声 / 英文字幕</option></select></label><label class="h5-field">授权开始（北京时间）<input class="h5-input" type="datetime-local" value="2026-10-01T00:00"></label><label class="h5-field">授权结束（北京时间）<input class="h5-input" type="datetime-local" value="2027-10-01T00:00"></label><label class="h5-field h5-span">授权登记说明<textarea class="h5-textarea" rows="2">演示登记；真实授权需运营核对。</textarea></label><label class="h5-field">前多少集免费<input id="h5-free" type="number" class="h5-input" min="0" max="35" step="1" value="${state.free}" required><small>后续集数需要有效全站会员</small></label><div><span class="h5-small h5-muted">当前来源</span><p style="margin-top:8px">${state.freeOverride?'单剧设置；全局同步保留本剧设置':'沿用创建时默认值'}</p></div></div><div class="h5-formactions"><span class="h5-small h5-muted">保存此页会将免费集数记为单剧设置</span><button type="submit" class="h5-button h5-primary cursor-interaction">保存授权与试看</button></div></form>`;}
function range(){const start=state.published+1;return {start,end:state.mode==='completed'?35:Math.min(35,start+state.batch-1)};}
function block(){const r=range();return state.issues.filter(n=>n>=r.start&&n<=r.end);}
function dateLabel(v=state.date){return v?v.replace('T',' ')+' 北京时间':'待设置';}
function futureDate(v=state.date){return !!v&&new Date(v+':00+08:00')>demoNow;}
function needsFutureDate(){return state.timing==='scheduled'||range().end<35;}
function scheduleRows(preview=state.plan==='draft',from=state.published+1){
let next=from;if(next>35)return '<div class="h5-note">全集已公开，无后续更新</div>';
const rows=[];let batch=0;
if(preview&&state.timing==='now'){const end=state.mode==='completed'?35:Math.min(35,next+state.batch-1);rows.push(`<div class="h5-schedule-row"><span class="h5-name">现在 · 首批</span><span class="h5-name">第 ${next}–${end} 集</span></div>`);next=end+1;}
while(next<=35&&rows.length<4){const end=state.mode==='completed'?35:Math.min(35,next+state.batch-1);const d=state.date?new Date(new Date(state.date+':00+08:00').getTime()+state.frequency*86400000*batch+8*3600000).toISOString().slice(5,16).replace('T',' '):'待设置时间';const problem=state.issues.some(n=>n>=next&&n<=end);rows.push(`<div class="h5-schedule-row"><span>${d}${state.plan==='paused'?'<br><small class="h5-muted">已暂停，恢复时确认时间</small>':''}</span><span>第 ${next}–${end} 集${problem?'<br><small class="h5-red">有素材待处理</small>':''}</span></div>`);next=end+1;batch++;}

}
function release(){

${state.mode==='updating'?`<div class="h5-formgrid" style="margin-top:16px"><label class="h5-field">更新频率<select id="h5-frequency" class="h5-select">${[[1,'每天'],[2,'每两天'],[7,'每周']].map(([v,l])=>`<option value="${v}" ${state.frequency===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="h5-field">每批集数<select id="h5-batch" class="h5-select">${[1,2,5,10,20].map(v=>`<option value="${v}" ${state.batch===v?'selected':''}>${v} 集</option>`).join('')}</select></label></div>`:''}

<div class="h5-formactions">${btn('保存草稿','save-plan')}<span class="h5-small h5-muted">不会启用发布</span></div></div>

${state.mode==='updating'?'<p class="h5-note">后续批次自动按计划更新；素材缺失时暂停，不跳集。补齐后需确认恢复。</p>':''}<p class="h5-error" id="h5-release-error" role="alert"></p><div class="h5-formactions">${btn('确认上线安排','confirm-release','h5-primary',issues.length?'disabled':'')}</div><p class="h5-note">${issues.length?'先处理当前批次的素材问题。':'下一步确认首批与后续安排。'}真实版权仍需运营核实。</p></div></div>`;

function renderBilling(){const items=[['orders','订单查询'],['prices','会员价格'],['cases','客服记录']];screen.innerHTML=heading('订单与会员','测试环境 · 全部金额以美元（USD）展示')+tabs(items,state.billTab,'billing')+panel(state.billTab==='prices'?`<form id="h5-pricing" class="h5-panel"><div class="h5-subhead"><div><h2>全站周会员</h2><p class="h5-muted h5-small">示例价格 · 尚非正式售价</p></div>${pill('每周自动续费')}</div><div class="h5-formgrid"><label class="h5-field">常规周价（USD）<div class="h5-money"><span>$</span><input name="price" class="h5-input" value="${state.price}" inputmode="decimal" required></div></label><label class="h5-field">首周优惠价（USD）<div class="h5-money"><span>$</span><input name="promo" class="h5-input" value="${state.promo}" inputmode="decimal" required></div></label></div><p id="h5-price-error" role="alert" class="h5-error" style="margin-top:10px"></p><div style="padding:18px 0"><h3>订阅页将这样展示</h3><p style="margin-top:7px" id="h5-price-preview">首周 $${state.promo}，之后 $${state.price} / 周</p></div><p class="h5-small h5-muted">新价格适用于后续新订阅；已有持续订阅按原约定价格续费。</p><div class="h5-formactions"><span class="h5-small h5-muted">最多两位小数</span><button class="h5-button h5-primary cursor-interaction" type="submit">保存测试价格</button></div></form>`:state.billTab==='orders'?`<div class="h5-panel"><h2>查询订单</h2><div class="h5-row" style="margin-top:16px"><input class="h5-input h5-search" aria-label="订单号" placeholder="输入完整站内订单号">${btn('查询示例','order-query','h5-primary')}</div><div id="h5-order-result" style="margin-top:18px"></div></div>`:`<div class="h5-panel"><h3>客服记录</h3><p class="h5-muted" style="margin:12px 0">查询订单后建立记录，备注、核实身份与代取消续费在该订单内完成。</p>${btn('前往订单查询','go-orders')}</div>`,'billing');}
function renderStaff(){const items=[['people','员工账号'],['audit','操作审计']];screen.innerHTML=heading('员工与权限','每人独立账号；账号与观众身份分开',state.staffTab==='people'?btn(icon('plus')+'新增员工','new-staff','h5-primary'):'')+tabs(items,state.staffTab,'staff')+panel(state.staffTab==='people'?`<div class="h5-table-wrap"><table><thead><tr><th>员工</th><th>角色</th><th>账号状态</th><th>二次验证</th><th></th></tr></thead><tbody><tr><td>负责人</td><td>负责人</td><td>${pill('启用','h5-ok')}</td><td>已设置</td><td>当前账号</td></tr><tr><td>示例运营</td><td>内容运营</td><td>${pill('启用','h5-ok')}</td><td>已设置</td><td>${link('管理','manage-staff')}</td></tr></tbody></table></div><p class="h5-note">新增账号放在弹窗内；密码至少 8 位，包含字母和数字。</p>`:history(),'staff');}
function renderSettings(){screen.innerHTML=heading('全局设置','仅负责人可修改全站默认规则')+`<form id="h5-default" class="h5-panel"><h2>默认免费集数</h2><label class="h5-field" style="max-width:260px;margin-top:18px">新剧默认前多少集免费<input class="h5-input" id="h5-global-free" type="number" min="0" max="10000" step="1" value="5" required></label><label class="h5-choice"><input name="free-scope" type="radio" value="new" checked><span>只影响之后新建的剧</span></label><label class="h5-choice"><input name="free-scope" type="radio" value="sync"><span>同时同步未单独设置的已有剧<small class="h5-muted" style="display:block">已单独设置的重点剧保留原值</small></span></label><div class="h5-formactions"><span class="h5-small h5-muted">下一步先查看影响范围</span><button class="h5-button h5-primary cursor-interaction" type="submit">查看影响并确认</button></div></form>`;}
function renderAcquisition(){const items=[['links','推广链接'],['pixels','像素资产'],['results','付款汇总'],['delivery','发送记录']];screen.innerHTML=heading('投流管理','此处仅展示分栏与金额规范；外部联调待完成')+tabs(items,state.acqTab,'acquisition')+panel(state.acqTab==='results'?`<div class="h5-table-wrap"><table><thead><tr><th>交易类型</th><th>笔数</th><th>已核实付款（USD）</th></tr></thead><tbody><tr><td>首次订阅 · 演示</td><td>2</td><td>$6.00</td></tr><tr><td>续费 · 演示</td><td>1</td><td>$12.00</td></tr></tbody></table></div>`:`<div class="h5-panel"><h3>${items.find(x=>x[0]===state.acqTab)[1]}</h3><p class="h5-muted" style="margin-top:12px">${state.acqTab==='links'?'此分栏只管理推广链接；选剧、平台与像素在新增弹窗中完成。':state.acqTab==='pixels'?'此分栏只管理获授权的像素；启停与分配操作保留在对应资产内。':'此分栏查看发送结果和失败原因；不把本地模拟记为平台接收成功。'}</p><p class="h5-note">本轮详细交互集中在内容管理、价格与员工账号。</p></div>`,'acquisition');}
const dialogSizer=new ResizeObserver(()=>{if(overlay.firstElementChild){const css=getComputedStyle(overlay);root.style.minHeight=Math.ceil(overlay.firstElementChild.offsetHeight+parseFloat(css.paddingTop)+parseFloat(css.paddingBottom)+2)+'px';}});
function showDialog(title,body,type){returnFocus=document.activeElement;dialogType=type;dialogSizer.disconnect();overlay.innerHTML=`<div class="h5-dialog" role="dialog" aria-modal="true" aria-labelledby="h5-dialog-title">${btn(icon('x'),'close','h5-close','aria-label="关闭"')}<h2 id="h5-dialog-title">${title}</h2>${body}</div>`;dialogSizer.observe(overlay.firstElementChild);root.querySelector('.h5-layout').inert=true;icons();setTimeout(()=>overlay.querySelector('input,button')?.focus(),0);}
function closeDialog(){dialogSizer.disconnect();overlay.innerHTML='';dialogType='';editSession=null;imageSession=null;root.style.minHeight='';root.querySelector('.h5-layout').inert=false;if(returnFocus?.isConnected)returnFocus.focus();}
function episodeData(n){return state.episodeMeta[n]||{title:`第 ${n} 集`,video:n===12&&state.issues.includes(12)?'未上传':`${String(n).padStart(2,'0')}.mp4`,subtitle:`${String(n).padStart(2,'0')}.srt`,language:'英文',videoVersion:1,subtitleVersion:1};}
function episodeEditor(){
const s=editSession,old=s.current;const changed=!!(s.video||s.subtitle),processing=[s.video,s.subtitle].some(x=>x?.status==='processing');
return `<form id="h5-episode-form"><p class="h5-note">${esc(state.title)} · ${s.n<=state.published?'已公开，当前版本继续可用':'草稿，保存后仍不对外公开'}</p><div class="h5-formgrid" style="margin-top:16px"><label class="h5-field">集数<input class="h5-input" value="${s.n}" readonly></label><label class="h5-field">分集标题<input class="h5-input" name="episodeTitle" value="${esc(s.title)}" required></label></div>
${[['video','视频','film'],['subtitle','字幕','captions']].map(([kind,title,ic])=>{const candidate=s[kind],bad=kind==='video'&&state.issues.includes(s.n);return `<section class="h5-media-row" aria-label="${title}文件"><div class="h5-row h5-spread"><h3>${icon(ic)} ${title}</h3>${btn((kind==='video'&&old.video==='未上传'?'上传':'替换')+title,'replace-media','',`data-media="${kind}" ${candidate?'disabled':''}`)}</div><div class="h5-current-file"><span class="h5-muted">当前文件</span>　<strong data-current-media="${kind}">${esc(old[kind])}</strong>　${pill(bad?'待处理':s.n<=state.published?'正在使用':'已就绪',bad?'h5-bad':'h5-ok')}</div>${kind==='subtitle'?`<label class="h5-row h5-small" style="margin-top:8px">字幕语言<select name="episodeLanguage" class="h5-select h5-select-inline">${['英文','简体中文'].map(v=>`<option ${v===s.language?'selected':''}>${v}</option>`).join('')}</select></label>`:''}${candidate?`<div class="h5-candidate" data-candidate="${kind}" aria-live="polite"><div class="h5-row h5-spread"><span>待替换：<strong>${esc(candidate.name)}</strong></span>${pill(candidate.status==='processing'?'处理中…':'已就绪，待确认',candidate.status==='processing'?'':'h5-ok')}</div><div class="h5-row" style="margin-top:6px">${candidate.status==='ready'?link('预览新版','preview-replacement',`data-media="${kind}"`):''}${link('取消替换','cancel-replacement',`data-media="${kind}"`)}</div>${candidate.preview?`<div class="h5-note">${kind==='video'?'新版视频预览区域（样稿无真实视频）':'新版字幕预览：00:00:01 → 00:00:03 · We meet again.'}</div>`:''}</div>`:''}</section>`;}).join('')}
<p class="h5-note">新版处理成功并确认后才替换；失败或取消时保留当前文件。已公开集数与更新计划不变。</p><p class="h5-note">样稿中的替换按钮使用示例文件演示。</p><div class="h5-modalfooter">${btn('取消','close')}<button type="submit" class="h5-button h5-primary cursor-interaction" ${processing?'disabled':''}>${changed?'保存并确认替换':'保存分集'}</button></div></form>`;
}
function paintEpisode(){const active=document.activeElement,name=active?.name,action=active?.dataset?.action,kind=active?.dataset?.media,start=active?.selectionStart,end=active?.selectionEnd;overlay.querySelector('#h5-episode-editor').innerHTML=episodeEditor();icons();const next=name?overlay.querySelector(`[name="${name}"]`):action?overlay.querySelector(`[data-action="${action}"]${kind?`[data-media="${kind}"]`:''}`):null;if(next&&!next.disabled){next.focus();if(typeof start==='number'&&next.setSelectionRange)next.setSelectionRange(start,end);}}
function openEpisode(n){const current={...episodeData(n)};editSession={n,current,title:current.title,language:current.language,video:null,subtitle:null};showDialog(`编辑第 ${n} 集`,`<div id="h5-episode-editor">${episodeEditor()}</div>`,'episode');}
function replaceMedia(kind){const session=editSession;if(!session)return;const version=(session.current[kind+'Version']||1)+1;const candidate={name:`${String(session.n).padStart(2,'0')}_v${version}.${kind==='video'?'mp4':'srt'}`,status:'processing'};session[kind]=candidate;paintEpisode();setTimeout(()=>{if(editSession===session&&session[kind]===candidate){candidate.status='ready';paintEpisode();}},750);}
function upload(){chosenFiles=false;showDialog('批量上传分集',`<p class="h5-small h5-muted">${esc(state.title)} · 示例上传，不读取你的真实文件</p><div class="h5-mini-flow" style="margin-top:18px"><strong>选择文件</strong>→ 核对集数 → 上传与处理</div><div class="h5-drop">${icon('cloud-upload')}<span>数字文件名自动匹配集数</span>${btn('选择示例视频','choose-files')}<small class="h5-muted">MP4 视频 · 实际上传与字幕按类型分批选择</small></div><div id="h5-upload-map"></div><div class="h5-modalfooter">${btn('取消','close')}${btn('开始模拟上传','start-upload','h5-primary','disabled id="h5-start-upload"')}</div>`,'upload');}
function releaseConfirm(){const r=range();if(block().length)return;if(needsFutureDate()&&!futureDate()){screen.querySelector('#h5-release-error').textContent='请设置未来的更新时间。样稿当前时间：10 月 21 日 12:00，北京时间。';return;}showDialog('确认上线安排',`<p class="h5-note">${esc(state.title)} · ${state.mode==='completed'?'全集一次上线':'分批更新'}</p><dl class="h5-dl"><dt>${state.timing==='now'?'现在上线':'首批上线'}</dt><dd>第 ${r.start}–${r.end} 集${state.timing==='scheduled'?'<br>'+dateLabel():''}</dd><dt>剩余集数</dt><dd>${r.end<35?`第 ${r.end+1}–35 集，继续按计划更新`:'无，全集完成上线'}</dd>${r.end<35?`<dt>更新规则</dt><dd>每 ${state.frequency} 天 ${state.batch} 集，最后一批发布剩余集数</dd>`:''}<dt>免费范围</dt><dd>前 ${state.free} 集；其余需要有效会员</dd></dl><h3>上线与更新排期（北京时间）</h3>${scheduleRows(true)}<p class="h5-note">${state.timing==='now'&&r.end<35?'这次确认同时完成首批上线和后续排期，无需再建一个发布计划。':'按上方时间与范围执行；上传或更换素材不会改变这个计划。'}</p><div class="h5-modalfooter">${btn('返回修改','close')}${btn(state.timing==='now'?(r.end<35?'确认上线并启用后续更新':'确认全集上线'):'确认启用计划','publish','h5-primary')}</div>`,'release');}
function log(action,result){state.history.unshift({time:'10-21 · 示例操作',action,result});}
root.addEventListener('click',e=>{
const mod=e.target.closest('[data-module]');if(mod){navigate(()=>{state.module=mod.dataset.module;});return;}
const tab=e.target.closest('[data-tab]');if(tab){navigate(()=>{const k=tab.dataset.kind;if(k==='detail')state.tab=tab.dataset.tab;else if(k==='content'){state.section=tab.dataset.tab;state.detail=false;}else if(k==='billing')state.billTab=tab.dataset.tab;else if(k==='staff')state.staffTab=tab.dataset.tab;else state.acqTab=tab.dataset.tab;});return;}
const filter=e.target.closest('[data-filter]');if(filter){state.filter=filter.dataset.filter;state.page=0;render();return;}
const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,n=Number(b.dataset.episode||1);
if(a==='close'){if(!busy)closeDialog();return;}
if(a==='back'){navigate(()=>{state.detail=false;state.section='library';});return;}
if(a==='open'){navigate(()=>openDrama());return;}
if(a==='go-release'){navigate(()=>openDrama('release'));return;}
if(a==='problems'){navigate(()=>{openDrama();state.filter='issues';});return;}
if(a==='prev'||a==='next'){state.page+=a==='prev'?-1:1;render();return;}
if(a==='upload'){upload();return;}
if(a==='choose-files'){chosenFiles=true;overlay.querySelector('#h5-upload-map').innerHTML=`<div class="h5-table-wrap"><table><thead><tr><th>文件</th><th>匹配分集</th><th>本次处理</th></tr></thead><tbody><tr><td>08.mp4</td><td>第 8 集</td><td>替换失败素材</td></tr><tr><td>12.mp4</td><td>第 12 集</td><td>补齐缺失视频</td></tr></tbody></table></div><p class="h5-note">仅更新这两集的视频；保留字幕与其他分集。</p>`;overlay.querySelector('#h5-start-upload').disabled=false;return;}
if(a==='start-upload'&&chosenFiles){busy=true;b.disabled=true;overlay.querySelector('.h5-close').disabled=true;overlay.querySelector('#h5-upload-map').innerHTML='<div class="h5-alert">演示：正在上传 2 个视频…</div>';setTimeout(()=>{overlay.querySelector('#h5-upload-map').innerHTML='<div class="h5-alert">演示：上传完成，正在处理视频…</div>';},350);setTimeout(()=>{state.issues=[];busy=false;log('补齐第 8、12 集视频','媒体就绪；未公开');closeDialog();openDrama();render();tell('演示：2 个视频已就绪，35 集齐全。你可以前往发布设置。');},900);return;}
if(a==='fix'){showDialog(`第 ${n} 集 · ${n===8?'视频处理失败':'缺少视频'}`,`<p class="h5-muted" style="margin:14px 0">${n===8?'原视频未完成处理。可重试；如果文件有问题，重新上传视频。':'这一集尚未绑定可用的视频，请补齐对应集数。'}</p><dl class="h5-dl"><dt>字幕</dt><dd>英文字幕已保留</dd><dt>当前公开</dt><dd>草稿，不可对外观看</dd></dl><div class="h5-modalfooter">${n===8?btn('模拟重试成功','retry','',`data-episode="${n}"`):''}${btn('上传替换文件','upload','h5-primary')}</div>`,'fix');return;}
if(a==='retry'){state.issues=state.issues.filter(x=>x!==n);log('重试第 '+n+' 集视频','就绪；未公开');closeDialog();render();tell('演示：处理成功，未自动发布。');return;}
if(a==='preview'){const ep=episodeData(n);showDialog(`预览 · ${esc(state.title)} · 第 ${n} 集`,`<div class="h5-preview-screen"><div style="text-align:center">${icon('play')}<p>播放器位置示意</p><small>本原型不加载真实视频</small></div></div><dl class="h5-dl"><dt>视频</dt><dd>${esc(ep.video)}</dd><dt>字幕</dt><dd>${esc(ep.language)} · ${esc(ep.subtitle)}</dd><dt>发布状态</dt><dd>${n<=state.published?'已公开':'草稿 · 仅员工预览'}</dd></dl><div class="h5-modalfooter">${btn('关闭预览','close')}</div>`,'preview');return;}
if(a==='edit-episode'){openEpisode(n);return;}
if(a==='replace-media'){replaceMedia(b.dataset.media);return;}
if(a==='cancel-replacement'){editSession[b.dataset.media]=null;paintEpisode();return;}
if(a==='preview-replacement'){const c=editSession[b.dataset.media];if(c){c.preview=!c.preview;paintEpisode();}return;}
if(a==='new'){showDialog('新建剧目',`<form id="h5-new"><p class="h5-muted h5-small" style="margin:12px 0 18px">先建草稿，再进入单剧工作页补齐资料与素材。</p><label class="h5-field">剧目名称<input class="h5-input" id="h5-new-name" placeholder="输入中文或英文剧名" required></label><div class="h5-modalfooter">${btn('取消','close')}<button class="h5-button h5-primary cursor-interaction" type="submit">创建并继续</button></div></form>`,'new');return;}
if(a==='other-drama'){showDialog('示例片库',`<p class="h5-muted" style="margin:15px 0">这两行用于展示上架、下架状态。本轮完整交互以「${esc(state.title)}」为例。</p><div class="h5-modalfooter">${btn('进入可操作示例','example','h5-primary')}</div>`,'other');return;}
if(a==='example'){closeDialog();openDrama();render();return;}
if(a==='save-plan'){log('保存发布计划草稿','未启用');tell('演示：计划草稿已保存，未启用发布。');return;}
if(a==='confirm-release'){releaseConfirm();return;}
if(a==='publish'){if(block().length||(needsFutureDate()&&!futureDate()))return;const r=range();if(state.timing==='now'){state.published=r.end;state.plan=state.published===35?'complete':'active';log(`公开第 ${r.start}–${r.end} 集`,state.plan==='active'?`后续从第 ${r.end+1} 集按计划更新`:'全集上线完成');}else{state.plan='active';log('启用发布计划',dateLabel());}closeDialog();render();tell(state.timing==='now'?(state.published===35?'演示：35 集已全部公开，无需后续更新。':`演示：首批已公开，剩余分集从 ${dateLabel()} 继续更新。`):'演示：计划已启用，当前尚未到上线时间。');persist();return;}
if(a==='early-release'){const r=range(),issues=block();showDialog('提前发布下一批',`<dl class="h5-dl"><dt>现在公开</dt><dd>第 ${r.start}–${r.end} 集</dd><dt>后续变化</dt><dd>${r.end===35?'全部公开后，更新计划结束':`下次仍是 ${dateLabel()}，改为从第 ${r.end+1} 集继续`}</dd></dl>${issues.length?`<p class="h5-error" role="alert">第 ${issues.join('、')} 集素材未就绪，本批不能发布。</p>`:'<p class="h5-note">已公开分集保留；不会重复发布这一批。</p>'}<div class="h5-modalfooter">${btn('取消','close')}${btn('确认提前发布','do-early-release','h5-primary',issues.length?'disabled':'')}</div>`,'early');return;}
if(a==='do-early-release'){if(block().length)return;const r=range();state.published=r.end;if(state.published===35)state.plan='complete';log(`提前公开第 ${r.start}–${r.end} 集`,'下一批起点已更新');closeDialog();render();tell('演示：公开集数和后续更新范围已同步调整。');return;}
if(a==='pause'){state.plan='paused';log('暂停后续发布','已公开内容保留');render();tell('演示：后续自动发布已暂停。');return;}
if(a==='resume'){showDialog('恢复更新',`<p class="h5-muted" style="margin:12px 0">从第 ${state.published+1} 集继续，不累计发布暂停期间的批次。</p><label class="h5-field">下一次发布时间（北京时间）<input class="h5-input" type="datetime-local" id="h5-resume-date" value="${state.date}"></label><p id="h5-resume-error" class="h5-error" role="alert"></p><div class="h5-modalfooter">${btn('取消','close')}${btn('确认恢复','do-resume','h5-primary')}</div>`,'resume');return;}
if(a==='do-resume'){const v=overlay.querySelector('#h5-resume-date').value;if(!futureDate(v)){overlay.querySelector('#h5-resume-error').textContent='请设置未来的时间，样稿当前为 10 月 21 日 12:00。';return;}state.date=v;state.plan='active';closeDialog();render();tell('演示：按确认的新时间恢复，未立即补发。');return;}
if(a==='revise'){showDialog('修改发布计划',`<p class="h5-muted" style="margin:15px 0">进入修改后先暂停后续更新。修改完成需重新检查并确认启用；已公开集数保留。</p><div class="h5-modalfooter">${btn('暂不修改','close')}${btn('暂停并修改','do-revise','h5-primary')}</div>`,'revise');return;}
if(a==='do-revise'){state.plan='draft';state.timing='scheduled';closeDialog();render();return;}
if(a==='withdraw'){showDialog('确认整剧下架',`<p class="h5-muted" style="margin:16px 0">本剧将从网站列表隐藏并停止新的播放；未执行的发布计划停用。素材、订单与观看记录保留。</p><div class="h5-modalfooter">${btn('取消','close')}${btn('确认下架','do-withdraw','h5-danger')}</div>`,'withdraw');return;}
if(a==='do-withdraw'){state.withdrawn=true;state.plan='draft';log('整剧下架','旧计划停用');closeDialog();render();return;}
if(a==='relist'){showDialog('重新上架',`<p class="h5-muted" style="margin:15px 0">恢复原已公开的 ${state.published} 集。旧排期保持停用，后续更新须重新设置并启用。</p><div class="h5-modalfooter">${btn('取消','close')}${btn('恢复已公开内容','do-relist','h5-primary')}</div>`,'relist');return;}
if(a==='do-relist'){state.withdrawn=false;state.plan='draft';closeDialog();render();tell('演示：已恢复原公开内容，请重新设置后续排期。');return;}
if(a==='new-staff'){showDialog('新增员工',`<form id="h5-staff-form"><div class="h5-formgrid" style="margin-top:20px"><label class="h5-field">姓名<input class="h5-input" name="name" placeholder="示例运营" required></label><label class="h5-field">角色<select class="h5-select" name="role"><option>内容运营</option><option>客服</option><option>投流</option><option>负责人</option></select></label><label class="h5-field h5-span">邮箱<input class="h5-input" type="email" name="email" placeholder="staff@example.test" required></label><label class="h5-field h5-span">初始密码<input class="h5-input" type="password" name="password" minlength="8" maxlength="128" autocomplete="off" placeholder="请用演示密码，勿填写真实密码" required><small>至少 8 位，包含字母和数字</small></label></div><p class="h5-error" role="alert" id="h5-staff-error"></p><p class="h5-note">首次登录后配置二次验证；本预览不会创建真实账号。</p><div class="h5-modalfooter">${btn('取消','close')}<button type="submit" class="h5-button h5-primary cursor-interaction">演示创建员工</button></div></form>`,'staff');return;}
if(a==='manage-staff'){showDialog('管理示例运营',`<label class="h5-field" style="margin-top:18px">角色<select class="h5-select"><option>内容运营</option><option>客服</option><option>投流</option></select></label><label class="h5-choice"><input type="checkbox" checked>启用账号</label><p class="h5-note">权限变更后撤销旧会话，按新权限重新登录。</p><div class="h5-modalfooter">${btn('取消','close')}${btn('保存','generic-save','h5-primary')}</div>`,'manage');return;}
if(a==='category'){showDialog(b.dataset.name?'编辑分类':'新增分类',`<form id="h5-simple"><div class="h5-formgrid" style="margin-top:20px"><label class="h5-field">中文名称<input class="h5-input" value="${esc(b.dataset.name||'新分类')}" required></label><label class="h5-field">英文名称<input class="h5-input" value="${esc(b.dataset.english||'New category')}"></label><label class="h5-field">排序<input class="h5-input" type="number" min="0" value="1"></label><label class="h5-choice"><input type="checkbox" checked>启用</label></div><div class="h5-modalfooter">${btn('取消','close')}<button class="h5-button h5-primary cursor-interaction" type="submit">保存示例</button></div></form>`,'simple');return;}
if(a==='banner'||a==='cover'){imageSession={type:a,candidate:null};showDialog(a==='banner'?'编辑首页 Banner':'更换竖版封面',`<form id="h5-simple"><div class="h5-formgrid" style="margin-top:20px">${a==='banner'?`<label class="h5-field">中文文案<input class="h5-input" value="本周精选" required></label><label class="h5-field">英文文案<input class="h5-input" value="Featured"></label><label class="h5-field h5-span">关联剧目<select class="h5-select"><option>${esc(state.title)}</option></select></label>`:''}<div class="h5-span"><div class="h5-row h5-spread"><span>${a==='banner'?'首页横图':'本剧竖版封面'}</span>${btn('上传替换图片','image-pick')}</div><div class="h5-current-file">当前图片：${esc(state[a])}</div><div class="h5-asset-preview" style="${a==='cover'?'width:90px;height:126px;':'height:120px;'}margin:12px 0">${icon('image')}</div><div id="h5-image-next" aria-live="polite"></div><p class="h5-note">在这里上传和替换，保存后应用到${a==='banner'?'这个 Banner':'本剧'}。</p><p class="h5-note">样稿使用示例图片演示。</p></div>${a==='banner'?'<label class="h5-field">排序<input class="h5-input" type="number" min="0" value="1"></label><label class="h5-choice"><input type="checkbox" checked>启用</label>':''}</div><div class="h5-modalfooter">${btn('取消','close')}<button class="h5-button h5-primary cursor-interaction" type="submit">保存${a==='banner'?' Banner':'封面'}</button></div></form>`,'simple');return;}
if(a==='image-pick'){imageSession.candidate=imageSession.type+'_new.jpg';overlay.querySelector('#h5-image-next').innerHTML=`<div class="h5-candidate">待替换：${esc(imageSession.candidate)}　${pill('已就绪，待保存','h5-ok')}</div>`;return;}
if(a==='order-query'){screen.querySelector('#h5-order-result').innerHTML=`<div class="h5-row h5-spread"><span>示例订单 TEST-001</span>${pill('测试付款','h5-warn')}</div><dl class="h5-dl"><dt>实付金额</dt><dd>$3.00 USD</dd><dt>约定续费价</dt><dd>$12.00 USD / 周</dd><dt>退款金额</dt><dd>$0.00 USD</dd></dl>`;return;}
if(a==='go-orders'){state.billTab='orders';render();return;}
if(a==='generic-save'||a==='confirm-global'){closeDialog();tell('演示：已确认这项操作，真实系统未改变。');return;}
if(a==='discard'||a==='save-leave'){if(a==='save-leave'&&state.tab==='info'){const f=screen.querySelector('#h5-info');if(f){if(!f.reportValidity())return;state.title=f.elements.title.value;state.en=f.elements.en.value;}}state.dirty=false;closeDialog();const fn=pendingNav;pendingNav=null;if(fn)fn();render();persist();return;}
});
root.addEventListener('input',e=>{
if(editSession&&e.target.name==='episodeTitle')editSession.title=e.target.value;
if(e.target.id==='h5-search'){const pos=e.target.selectionStart;state.search=e.target.value;render();const input=screen.querySelector('#h5-search');input.focus();input.setSelectionRange(pos,pos);}
if(e.target.closest('#h5-info')){state.dirty=true;screen.querySelector('#h5-dirty-label').textContent='有未保存的修改';}
if(e.target.closest('#h5-pricing')){const f=e.target.closest('form');const a=f.elements.price.value,b=f.elements.promo.value;screen.querySelector('#h5-price-preview').textContent=`首周 $${b||'—'}，之后 $${a||'—'} / 周`;}
});
root.addEventListener('change',e=>{const el=e.target;if(el.name==='release-mode'){state.mode=el.value;render();}if(el.name==='release-timing'){state.timing=el.value;render();}if(el.id==='h5-date'){state.date=el.value;render();}if(el.id==='h5-frequency'){state.frequency=Number(el.value);render();}if(el.id==='h5-batch'){state.batch=Number(el.value);render();}if(el.id==='h5-list-filter'){state.listFilter=el.value;render();}if(el.name==='episodeLanguage'&&editSession)editSession.language=el.value;});
function handleForm(f){
if(f.id==='h5-info'){state.title=f.elements.title.value;state.en=f.elements.en.value;state.dirty=false;log('保存剧目资料','成功');render();tell('演示：资料已保存。');}
if(f.id==='h5-rights'){state.free=Number(screen.querySelector('#h5-free').value);state.freeOverride=true;render();tell('演示：本剧免费集数已保存为单独设置。');}
if(f.id==='h5-new'){const title=overlay.querySelector('#h5-new-name').value;closeDialog();state.title=title;state.en='Demo title';state.published=0;state.plan='draft';state.issues=[8,12];openDrama('info');render();tell('演示：草稿已创建，使用示例分集供你继续体验上传和发布。');}
if(f.id==='h5-staff-form'){const p=f.elements.password.value;if(p.length<8||!/[A-Za-z]/.test(p)||!/\d/.test(p)){overlay.querySelector('#h5-staff-error').textContent='密码至少 8 位，并包含字母和数字。';return;}f.elements.password.value='';closeDialog();tell('演示：8 位且含字母、数字的密码校验通过，未创建真实员工。');}
if(f.id==='h5-pricing'){const decimal=/^(?:0|[1-9]\d*)(?:\.\d{1,2})?$/;const a=f.elements.price.value.trim(),b=f.elements.promo.value.trim();if(!decimal.test(a)||!decimal.test(b)||Number(a)<.01||Number(b)<.01||Number(a)>999999.99||Number(b)>Number(a)){screen.querySelector('#h5-price-error').textContent='请输入正数美元金额，最多两位小数；优惠价不得高于常规价。';return;}state.price=Number(a).toFixed(2);state.promo=Number(b).toFixed(2);render();tell('演示：测试价格已更新，金额按美元输入与展示。');}
if(f.id==='h5-default'){const n=screen.querySelector('#h5-global-free').value,sync=f.querySelector('[name="free-scope"]:checked').value==='sync';showDialog('确认默认免费集数',`<dl class="h5-dl"><dt>新默认值</dt><dd>前 ${esc(n)} 集免费</dd><dt>影响范围</dt><dd>${sync?'新剧与未单独设置的已有剧':'仅之后新建的剧'}</dd></dl>${sync?`<p class="h5-small">示例影响清单：迟到的告白${state.freeOverride?'':'、'+esc(state.title)}。已单独设置的剧保持原值。</p>`:''}<div class="h5-modalfooter">${btn('返回修改','close')}${btn('确认保存','confirm-global','h5-primary')}</div>`,'global');}
if(f.id==='h5-episode-form'&&editSession){const s=editSession;if([s.video,s.subtitle].some(x=>x?.status==='processing'))return;const data={...s.current,title:s.title,language:s.language};for(const kind of ['video','subtitle']){if(s[kind]){data[kind]=s[kind].name;data[kind+'Version']=(data[kind+'Version']||1)+1;}}state.episodeMeta[s.n]=data;if(s.video)state.issues=state.issues.filter(x=>x!==s.n);log(`保存第 ${s.n} 集`,s.video||s.subtitle?'新版文件已确认替换，公开状态不变':'分集资料已保存');closeDialog();render();tell(`演示：第 ${s.n} 集已保存，当前仍有 ${state.published} 集公开。`);}
if(f.id==='h5-simple'){const type=imageSession?.type;if(imageSession?.candidate)state[type]=imageSession.candidate;closeDialog();if(type==='cover'){screen.querySelector('#h5-cover-name').textContent=state.cover;}else render();tell('演示：已保存，真实内容未改变。');}
}
root.addEventListener('click',e=>{const submit=e.target.closest('button[type="submit"]');if(submit?.form&&root.contains(submit)){e.preventDefault();if(submit.form.reportValidity())handleForm(submit.form);}},true);
root.addEventListener('submit',e=>{e.preventDefault();handleForm(e.target);});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.form){const submit=e.target.form.querySelector('button[type="submit"]');if(submit){e.preventDefault();submit.click();}}});
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.children.length&&!busy){e.preventDefault();closeDialog();}if(e.key==='Tab'&&overlay.children.length){const q=[...overlay.querySelectorAll('button:not(:disabled),input,select,textarea')].filter(x=>x.offsetParent!==null);if(e.shiftKey&&document.activeElement===q[0]){e.preventDefault();q[q.length-1]?.focus();}else if(!e.shiftKey&&document.activeElement===q[q.length-1]){e.preventDefault();q[0]?.focus();}}if(e.target.getAttribute('role')==='tab'&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const all=[...e.target.parentElement.querySelectorAll('[role=tab]')];const i=all.indexOf(e.target);all[e.key==='Home'?0:e.key==='End'?all.length-1:(i+(e.key==='ArrowRight'?1:-1)+all.length)%all.length].focus();}});
render();
if(globalThis.Tweak){const design={dense:false};const tweak=new Tweak({container:root,onChange:()=>root.style.setProperty('--h5-pad',design.dense?'10px':'15px')});tweak.addToggle(design,'dense',{label:'紧凑列表'});}
})();
</script>
