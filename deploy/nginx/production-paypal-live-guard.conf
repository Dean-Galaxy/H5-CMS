# Include inside the existing exact location = /webhooks/paypal/live only.
# Keep the existing FastCGI configuration and application's signature verification.
if ($request_method != POST) { return 405; }
if ($request_uri != /webhooks/paypal/live) { return 404; }
if ($http_paypal_auth_algo = "") { return 400; }
if ($http_paypal_cert_url = "") { return 400; }
if ($http_paypal_transmission_id = "") { return 400; }
if ($http_paypal_transmission_sig = "") { return 400; }
if ($http_paypal_transmission_time = "") { return 400; }

client_max_body_size 256k;
client_body_timeout 10s;
fastcgi_request_buffering on;

# Bound requests across all source addresses. Rejected callbacks receive real HTTP 429.
limit_req zone=h5_paypal_live_rate burst=8 nodelay;
limit_conn h5_paypal_live_inflight 2;
limit_req_status 429;
limit_conn_status 429;
